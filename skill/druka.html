<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skill Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-dark text-light">

<div class="container py-4">

  <!-- Header Controls -->
  <div class="mb-3 d-flex align-items-center gap-3">
    <label for="charLevel-global" class="form-label mb-0">Set character level</label>
    <select id="charLevel-global" class="form-select form-select-sm w-auto"></select>
    <span>Skill Points: <strong id="points-global">0</strong></span>
    <button id="reset-global" class="btn btn-warning btn-sm">Reset Skill Points</button>
  </div>

  <!-- Tabs -->
  <ul class="nav nav-tabs mb-3" id="skillTabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="blade-tab" data-bs-toggle="tab" data-bs-target="#blade-content" type="button" role="tab">Blade</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="archery-tab" data-bs-toggle="tab" data-bs-target="#archery-content" type="button" role="tab">Archery</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="support-tab" data-bs-toggle="tab" data-bs-target="#support-content" type="button" role="tab">Support</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="amara-tab" data-bs-toggle="tab" data-bs-target="#amara-content" type="button" role="tab">Amara</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="god-tab" data-bs-toggle="tab" data-bs-target="#god-content" type="button" role="tab">God</button>
    </li>
  </ul>

  <!-- Tab Content -->
  <div class="tab-content" id="skillTabsContent">
    <!-- Blade Tab -->
    <div class="tab-pane fade show active" id="blade-content" role="tabpanel">
      <!-- Skill Tree -->
      <div id="tree-blade" class="skill-grid"></div>
    </div>

    <!-- Archery Tab -->
    <div class="tab-pane fade" id="archery-content" role="tabpanel">
      <!-- Skill Tree -->
      <div id="tree-archery" class="skill-grid"></div>
    </div>

    <!-- Support Tab -->
    <div class="tab-pane fade" id="support-content" role="tabpanel">
      <!-- Skill Tree -->
      <div id="tree-support" class="skill-grid"></div>
    </div>

    <!-- Amara Tab -->
    <div class="tab-pane fade" id="amara-content" role="tabpanel">
      <!-- Skill Tree -->
      <div id="tree-amara" class="skill-grid"></div>
    </div>

    <!-- God Tab -->
    <div class="tab-pane fade" id="god-content" role="tabpanel">
      <!-- Skill Tree -->
      <div id="tree-god" class="skill-grid"></div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="skillData.js"></script>
<script src="druka/character.js"></script>
<script src="druka/blade.js"></script>
<script src="druka/archery.js"></script>
<script src="druka/support.js"></script>
<script src="druka/amara.js"></script>
<script src="druka/god.js"></script>
</body>
<script src="druka/god.js"></script>
</body>
</html>
