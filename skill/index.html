<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skill Builder Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .sidebar {
      background-color: #1a1a1a;
      border-right: 1px solid #444;
      min-height: 100vh;
      padding: 20px 0;
    }

    .class-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .class-list li {
      padding: 12px 20px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.3s ease;
    }

    .class-list li:hover {
      background-color: #2a2a2a;
      border-left-color: #0d6efd;
    }

    .class-list li.active {
      background-color: #2a2a2a;
      border-left-color: #0d6efd;
      color: #0d6efd;
      font-weight: bold;
    }

    .content-panel {
      padding: 30px;
      min-height: 100vh;
    }

    .dashboard-title {
      margin-bottom: 30px;
      font-size: 2rem;
      font-weight: bold;
    }

    .welcome-message {
      color: #aaa;
      text-align: center;
      padding: 60px 20px;
    }

    iframe {
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0.7;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>

<body class="bg-dark text-light">

<div class="row g-0">
  <!-- Left Panel - Class List -->
  <div class="col-md-3 sidebar">
    <div style="padding: 0 20px; margin-bottom: 20px;">
      <h5 class="text-primary">Classes</h5>
    </div>
    <ul class="class-list">
      <li class="class-item active" data-class="Druka">Druka</li>
      <li class="class-item" data-class="Karya">Karya</li>
      <li class="class-item" data-class="Samabat">Samabat</li>
      <li class="class-item" data-class="Abikara">Abikara</li>
      <li class="class-item" data-class="Vidya">Vidya</li>
      <li class="class-item" data-class="Nakayuda">Nakayuda</li>
      <li class="class-item" data-class="Satya">Satya</li>
      <li class="class-item" data-class="Banar">Banar</li>
    </ul>
  </div>

  <!-- Right Panel - Content Area -->
  <div class="col-md-9 content-panel">
    <iframe id="contentFrame" src="druka.html" style="width: 100%; border: none; min-height: 100vh;"></iframe>
  </div>
</div>

<script>
  // Handle class selection
  document.querySelectorAll('.class-item').forEach(item => {
    item.addEventListener('click', function() {
      // Prevent redundant clicks on already active item
      if (this.classList.contains('active')) {
        return;
      }

      // Remove active class from all items
      document.querySelectorAll('.class-item').forEach(el => el.classList.remove('active'));
      
      // Add active class to clicked item
      this.classList.add('active');
      
      // Get the selected class and load its HTML file
      const selectedClass = this.getAttribute('data-class').toLowerCase();
      const htmlFile = selectedClass + '.html'; // e.g., druka.html, karya.html
      
      // Load the selected class HTML into the iframe
      document.getElementById('contentFrame').src = htmlFile;
    });
  });
</script>
</body>
</html>
